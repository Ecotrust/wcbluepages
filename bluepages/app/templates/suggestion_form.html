{% load crispy_forms_tags %}

{% crispy contact_form %}

<div class="mt-3">
    <button type="button" class="btn btn-primary modal-submit-button" onclick="app.submitContactSuggestion()">
        Submit
    </button>

    {% if contact_id %}
        <button type="button" class="btn btn-secondary" onclick="app.prepContactMenuModal({'contact_suggestion': {'id': {{ contact_id }}  } })">
            &lt; Back
        </button>
    {% else %}
        <button type="button" class="btn btn-secondary modal-submit-button" onclick="app.loadSuggestionMenu()">
            &lt; Back
        </button>
    {% endif %}
</div>
