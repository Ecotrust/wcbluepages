{% load static %}
<div class="header-flex">
  <div class="logo header-logo">
    <a href="https://westcoastoceanalliance.org" target="_blank">
      <img
        id="header-logo"
        src="{% static 'app/img/wcoa_header_blue.jpg' %}"
        alt="West Coast Ocean Alliance"
      />
    </a>
    <div class="header-title">
      <div class="vertical-divider">
        <h1 id="header-title">
          <a class="home-link" href="/">
            West Coast Blue Pages
            <span
              >Better Ocean Planning Through More Effective Coordination</span
            >
          </a>
        </h1>
      </div>
    </div>
  </div>

  <div class="header-user">
    {% if user.is_authenticated %}
    <button class="btn btn-primary" onclick="app.loadSuggestionForm()">
      <i class="bi bi-person-add"></i> Suggest Contact
    </button>
    <button class="btn btn-primary" onclick="app.loadSuggestionMenu()">
      <i class="bi bi-gear"></i> Manage
    </button>
    <div class="vertical-divider"></div>
    <button class="btn btn-primary" onclick="app.prepExploreModal('Entities')">
      Entities
    </button>
    {% endif %}
    {% if user.is_authenticated %}
    <button class="btn btn-primary" onclick="app.loadAccountModal()">
      Account
    </button>
    <button class="btn btn-primary" onclick="app.logoutRUS()">Logout</button>
    {% endif %}
  </div>
</div>
