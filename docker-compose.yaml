services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: bluepages_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_dump.sql:/tmp/db_dump.sql:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost -p ${DB_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: bluepages_web
    volumes:
      - .:/app
      - static_volume:/app/bluepages/static_root
      - media_volume:/app/bluepages/media_root
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume: