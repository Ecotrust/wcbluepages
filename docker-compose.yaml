services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: bluepages_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_dump.sql:/tmp/db_dump.sql:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost -p ${DB_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: bluepages_web
    volumes:
      - ./bluepages:/app/bluepages
      - js_dist:/app/bluepages/app/static/app/js/dist
      - static_volume:/app/bluepages/static_root
      - media_volume:/app/bluepages/media_root
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy

  js-watch:
    image: node:20-slim
    container_name: bluepages_js_watch
    working_dir: /workspace
    volumes:
      - .:/workspace
      - js_dist:/workspace/bluepages/app/static/app/js/dist
      - app_node_modules:/workspace/bluepages/app/static/app/js/app/node_modules
      - record_suggestion_node_modules:/workspace/bluepages/app/static/app/js/record_suggestion/node_modules
      - region_picker_node_modules:/workspace/bluepages/app/static/app/js/region_picker/node_modules
    environment:
      WATCHPACK_POLLING: "true"
    command: >-
      sh -lc '
        set -e;
        mkdir -p /workspace/bluepages/app/static/app/js/dist;

        cd /workspace/bluepages/app/static/app/js/app;
        npm ci;
        cp ./node_modules/datatables/media/css/jquery.dataTables.min.css ../dist/;

        cd /workspace/bluepages/app/static/app/js/record_suggestion;
        npm ci;

        cd /workspace/bluepages/app/static/app/js/region_picker;
        npm ci;

        cd /workspace/bluepages/app/static/app/js/app && npx webpack --mode=development --watch --output-path ../dist &
        cd /workspace/bluepages/app/static/app/js/record_suggestion && npx webpack --mode=development --watch --output-path ../dist &
        cd /workspace/bluepages/app/static/app/js/region_picker && npx webpack --mode=development --watch --output-path ../dist &
        wait
      '

volumes:
  postgres_data:
  static_volume:
  media_volume:
  js_dist:
  app_node_modules:
  record_suggestion_node_modules:
  region_picker_node_modules: