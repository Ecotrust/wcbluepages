upstream bluepages_web {
    server web:8000;
}

server {
    listen 80;
    server_name bluepages.westcoastoceanalliance.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bluepages.westcoastoceanalliance.org;
    client_max_body_size 100M;

    access_log /var/log/nginx/bluepages.access.log;
    error_log /var/log/nginx/bluepages.error.log;

    ssl_certificate     /etc/letsencrypt/live/bluepages.westcoastoceanalliance.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bluepages.westcoastoceanalliance.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /static/ {
        alias /app/static_root/;
    }

    location /media/ {
        alias /app/media_root/;
    }

    location / {
        proxy_pass http://bluepages_web;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
